name: HoloXlife Pure Ada OS Build and Boot Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-and-test-pure-ada:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: emergeos.img
      SERIAL_LOG: serial.log
      BOCHS_LOG: bochs.log
      BOCHS_CONFIG: bochsrc.txt
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clean Up Old Files
        run: |
          echo "🧹 Removing old files that cause conflicts..."
          OLD_FILES=(
            "kernel_entry.adb"
            "kernel_entry.asm"
            "s-lastch.ads"
            "s-lastch.adb"
            "s-memory.ads"
            "s-memory.adb"
            "holographic_kernel.c"
            "*.adb"
            "*.ads"
            "*.txt"
          )
          for file in "${OLD_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "🗑️  Deleting: $file"
              rm -f "$file"
            fi
          done
          echo "✅ Cleanup complete"

      - name: Cache APT Dependencies
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-pure-ada-${{ hashFiles('**/Makefile') }}-v4
          restore-keys: |
            ${{ runner.os }}-pure-ada-

      - name: Install Pure Ada Compiler and Dependencies
        run: |
          echo "📦 Installing GNAT Ada compiler for Pure Ada OS..."
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential \
            nasm \
            gnat-10 \
            gcc-10-multilib \
            binutils \
            bochs \
            bochs-x \
            gettext-base \
            xvfb \
            libncurses5-dev \
            xxd \
            qemu-system-i386
          echo "✅ Pure Ada toolchain installation complete"

      - name: Verify Pure Ada Installation
        run: |
          echo "🔍 Verifying Pure Ada toolchain..."
          echo "GNAT version:"
          gnat --version 2>/dev/null || echo "GNAT check failed"
          echo ""
          echo "GCC version (for Ada):"
          gcc-10 --version | head -1 || echo "GCC-10 not available"
          echo ""
          echo "NASM version:"
          nasm --version || echo "NASM not available"
          echo ""
          echo "QEMU version:"
          qemu-system-i386 --version | head -1 || echo "QEMU check failed"
          echo ""
          echo "Bochs version:"
          bochs --version 2>&1 | head -3 || echo "Bochs version check failed"
          echo "✅ Pure Ada toolchain verification complete"

      - name: Show Pure Ada Project Files
        run: |
          echo "📁 HoloXlife Pure Ada OS structure:"
          ls -la
          echo ""
          echo "🔍 Checking Pure Ada OS files (NO C FILES EXPECTED):"
          echo "REQUIRED FILES:"
          for file in \
            boot.asm \
            linker.ld \
            emergeos.ads \
            emergeos.adb \
            system.ads \
            boot.adb \
            Makefile; do
            if [ -f "$file" ]; then
              echo "✅ $file ($(stat -c%s "$file") bytes)"
            else
              echo "❌ $file - MISSING (REQUIRED)"
            fi
          done
          echo ""
          echo "✅ Pure Ada OS file check complete"

      - name: Build Pure Ada OS
        run: |
          echo "🔨 Building HoloXlife Pure Ada OS..."
          make clean || true
          make all
          echo "✅ Build complete"

      - name: Verify Build Artifacts
        run: |
          echo "🔍 Verifying build artifacts..."
          if [ -f "$IMAGE_NAME" ]; then
            echo "✅ $IMAGE_NAME created ($(stat -c%s "$IMAGE_NAME") bytes)"
            file "$IMAGE_NAME"
          else
            echo "❌ $IMAGE_NAME not found!"
            exit 1
          fi

      - name: Test Boot with QEMU
        run: |
          echo "🚀 Testing Pure Ada OS boot with QEMU..."
          timeout 30 qemu-system-i386 \
            -drive format=raw,file="$IMAGE_NAME" \
            -serial file:"$SERIAL_LOG" \
            -display none \
            -no-reboot \
            -no-shutdown || true
          
          echo ""
          echo "📋 Serial output:"
          if [ -f "$SERIAL_LOG" ]; then
            cat "$SERIAL_LOG"
            echo ""
            echo "✅ QEMU test complete"
          else
            echo "⚠️  No serial output captured"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pure-ada-os-build
          path: |
            ${{ env.IMAGE_NAME }}
            ${{ env.SERIAL_LOG }}
            *.o
            *.ali
            *.adb
            *.ads
            *.img
            *.txt
            *.grp
            *.grs
          retention-days: 7
