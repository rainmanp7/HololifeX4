name: HoloXlife Pure Ada OS Build and Boot Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-and-test-pure-ada:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: emergeos.img
      SERIAL_LOG: serial.log
      BOCHS_LOG: bochs.log
      BOCHS_CONFIG: bochsrc.txt
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: NUCLEAR CLEAN - Remove ALL Build Artifacts
        run: |
          echo "💥 NUCLEAR CLEAN - Removing ALL build artifacts..."
          # Remove ALL possible build artifacts
          rm -rf *.o *.ali *.elf *.bin *.img *.adc bochs*.log serial*.log
          rm -rf .obj .libs build dist out target
          # Force fresh checkout
          git clean -fdx || echo "Git clean failed, continuing..."
          git reset --hard HEAD || echo "Git reset failed, continuing..."
          echo "✅ Nuclear clean complete - pristine source state"

      - name: Cache ONLY APT Packages (NO BUILD ARTIFACTS)
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-packages-${{ hashFiles('**/Makefile', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-apt-packages-

      - name: Install Pure Ada Compiler and Dependencies
        run: |
          echo "📦 Installing GNAT Ada compiler for Pure Ada OS..."
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential \
            nasm \
            gnat-10 \
            gcc-10-multilib \
            binutils \
            bochs \
            bochs-x \
            gettext-base \
            xvfb \
            libncurses5-dev \
            xxd \
            qemu-system-i386
          echo "✅ Pure Ada toolchain installation complete"

      - name: Verify Source File Integrity
        run: |
          echo "🔍 Verifying source file integrity and dependencies..."
          echo "Required files check:"
          REQUIRED_FILES=(
            "boot.asm"
            "linker.ld" 
            "emergeos.ads"
            "emergeos.adb"
            "system.ads"
            "boot.adb"
            "Makefile"
            "manifolds.ads"
            "manifolds.adb"
            "operations.ads"
            "operations.adb"
            "holography.ads"
            "holography.adb"
            "patterns.ads"
            "patterns.adb"
          )
          MISSING_COUNT=0
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file ($(stat -c%s "$file") bytes)"
            else
              echo "❌ $file - MISSING"
              MISSING_COUNT=$((MISSING_COUNT + 1))
            fi
          done
          if [ $MISSING_COUNT -gt 0 ]; then
            echo "🚨 CRITICAL: $MISSING_COUNT required files missing!"
            echo "Available files:"
            ls -la
            exit 1
          fi
          echo "✅ All required source files present"

      - name: Force Fresh Build with Clean Slate
        run: |
          echo "🔨 FORCE FRESH BUILD - Clean slate approach..."
          echo "Step 1: Manual clean (bypass Makefile)"
          rm -f *.o *.ali *.elf *.bin *.img gnat.adc 2>/dev/null || true
          
          echo "Step 2: Create fresh gnat.adc"
          cat > gnat.adc << 'EOF'
          pragma Restrictions (No_Exceptions);
          pragma Restrictions (No_Implicit_Heap_Allocations);
          pragma Restrictions (No_Tasking);
          pragma Restrictions (No_Protected_Types);
          pragma Restrictions (No_Finalization);
          pragma Restrictions (No_Secondary_Stack);
          EOF
          echo "✅ gnat.adc created"
          cat gnat.adc

      - name: Build HoloXlife Pure Ada OS (Step-by-Step)
        run: |
          echo "🔨 Building HoloXlife Pure Ada OS (Step-by-Step)..."
          echo "=========================================="
          
          # Compile each file individually with verbose output
          echo ""
          echo "Step 1: Compiling boot.adb..."
          gcc-10 -x ada -gnat2012 -gnatwa -gnatwo -gnatp -O2 -m32 -nostdlib -nodefaultlibs -fno-stack-protector -static -c -gnatec=gnat.adc boot.adb -o boot.o
          [ -f boot.o ] && echo "✅ boot.o created ($(stat -c%s boot.o) bytes)" || { echo "❌ boot.o failed"; exit 1; }
          
          echo ""
          echo "Step 2: Compiling emergeos.adb..."
          gcc-10 -x ada -gnat2012 -gnatwa -gnatwo -gnatp -O2 -m32 -nostdlib -nodefaultlibs -fno-stack-protector -static -c -gnatec=gnat.adc emergeos.adb -o emergeos.o
          [ -f emergeos.o ] && echo "✅ emergeos.o created ($(stat -c%s emergeos.o) bytes)" || { echo "❌ emergeos.o failed"; exit 1; }
          
          echo ""
          echo "Step 3: Compiling manifolds.adb..."
          gcc-10 -x ada -gnat2012 -gnatwa -gnatwo -gnatp -O2 -m32 -nostdlib -nodefaultlibs -fno-stack-protector -static -c -gnatec=gnat.adc manifolds.adb -o manifolds.o
          [ -f manifolds.o ] && echo "✅ manifolds.o created ($(stat -c%s manifolds.o) bytes)" || { echo "❌ manifolds.o failed"; exit 1; }
          
          echo ""
          echo "Step 4: Compiling operations.adb..."
          gcc-10 -x ada -gnat2012 -gnatwa -gnatwo -gnatp -O2 -m32 -nostdlib -nodefaultlibs -fno-stack-protector -static -c -gnatec=gnat.adc operations.adb -o operations.o
          [ -f operations.o ] && echo "✅ operations.o created ($(stat -c%s operations.o) bytes)" || { echo "❌ operations.o failed"; exit 1; }
          
          echo ""
          echo "Step 5: Compiling holography.adb..."
          gcc-10 -x ada -gnat2012 -gnatwa -gnatwo -gnatp -O2 -m32 -nostdlib -nodefaultlibs -fno-stack-protector -static -c -gnatec=gnat.adc holography.adb -o holography.o
          [ -f holography.o ] && echo "✅ holography.o created ($(stat -c%s holography.o) bytes)" || { echo "❌ holography.o failed"; exit 1; }
          
          echo ""
          echo "Step 6: Compiling patterns.adb..."
          gcc-10 -x ada -gnat2012 -gnatwa -gnatwo -gnatp -O2 -m32 -nostdlib -nodefaultlibs -fno-stack-protector -static -c -gnatec=gnat.adc patterns.adb -o patterns.o
          [ -f patterns.o ] && echo "✅ patterns.o created ($(stat -c%s patterns.o) bytes)" || { echo "❌ patterns.o failed"; exit 1; }
          
          echo ""
          echo "Step 7: Linking kernel..."
          ld -m elf_i386 -T linker.ld --nmagic -nostdlib -static -o kernel.elf boot.o emergeos.o manifolds.o operations.o holography.o patterns.o
          [ -f kernel.elf ] && echo "✅ kernel.elf created ($(stat -c%s kernel.elf) bytes)" || { echo "❌ kernel.elf failed"; exit 1; }
          
          echo ""
          echo "Step 8: Creating kernel.bin..."
          objcopy -O binary kernel.elf kernel.bin
          [ -f kernel.bin ] && echo "✅ kernel.bin created ($(stat -c%s kernel.bin) bytes)" || { echo "❌ kernel.bin failed"; exit 1; }
          
          echo ""
          echo "Step 9: Building bootloader..."
          SECTORS=$(( ($(stat -c%s kernel.bin) + 511) / 512 ))
          echo "Building with $SECTORS kernel sectors"
          nasm -f bin -D HOLOGRAPHIC_KERNEL_SECTORS=$SECTORS boot.asm -o boot.bin
          [ -f boot.bin ] && echo "✅ boot.bin created ($(stat -c%s boot.bin) bytes)" || { echo "❌ boot.bin failed"; exit 1; }
          
          echo ""
          echo "Step 10: Creating OS image..."
          dd if=/dev/zero of=$IMAGE_NAME bs=512 count=2880 2>/dev/null
          dd if=boot.bin of=$IMAGE_NAME conv=notrunc 2>/dev/null
          dd if=kernel.bin of=$IMAGE_NAME bs=512 seek=1 conv=notrunc 2>/dev/null
          [ -f $IMAGE_NAME ] && echo "✅ $IMAGE_NAME created ($(stat -c%s $IMAGE_NAME) bytes)" || { echo "❌ $IMAGE_NAME failed"; exit 1; }
          
          echo ""
          echo "🎉 HOLOXLIFE PURE ADA OS BUILD SUCCESSFUL!"
          echo "=========================================="

      # ... rest of your existing steps (analysis, testing, etc.) remain the same
