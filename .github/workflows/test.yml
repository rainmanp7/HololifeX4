name: HoloXlife Pure Ada OS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          nasm \
          gnat-10 \
          gcc-10-multilib \
          qemu-system-i386

    - name: Build OS (Makefile's Job)
      run: |
        echo "=== Letting Makefile do its job ==="
        make emergeos.img
        echo "Build completed"

    - name: Verify Build Output
      run: |
        echo "=== Checking what Makefile produced ==="
        ls -la *.img *.bin *.elf || echo "No build artifacts found"
        [ -f emergeos.img ] && echo "✅ emergeos.img created: $(stat -c%s emergeos.img) bytes" || echo "❌ emergeos.img missing"

    - name: Test Boot
      run: |
        echo "=== Testing boot ==="
        timeout 10s qemu-system-i386 \
          -drive file=emergeos.img,format=raw,if=floppy \
          -d cpu_reset,guest_errors \
          -no-reboot \
          -nographic \
          > qemu_output.log 2>&1 || true
        
        echo "=== Boot Analysis ==="
        grep -i "triple fault\|cpu reset\|terminating" qemu_output.log || echo "No significant errors detected"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          emergeos.img
          *.bin
          *.elf
          *.o
          qemu_output.log
