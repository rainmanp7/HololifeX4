name: Minimal Bootloader Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install QEMU
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-i386

    - name: Create Minimal Bootloader
      run: |
        echo "=== Creating minimal bootloader ==="
        cat > minimal.asm << 'EOF'
[org 0x7c00]
[bits 16]
start:
    mov ax, 0
    mov ds, ax
    mov es, ax 
    mov ss, ax
    mov sp, 0x7c00
    
    ; Print boot message
    mov si, msg
print_loop:
    lodsb
    test al, al
    jz hang
    mov ah, 0x0e
    int 0x10
    jmp print_loop

hang:
    jmp hang

msg: db 'BOOTED!', 0

times 510-($-$$) db 0
dw 0xaa55
EOF
        
        nasm -f bin minimal.asm -o boot.bin
        echo "Bootloader created: $(stat -c%s boot.bin) bytes"

    - name: Create Bootable Image
      run: |
        dd if=/dev/zero of=boot.img bs=512 count=2880
        dd if=boot.bin of=boot.img conv=notrunc
        echo "Image created"

    - name: Test Boot
      run: |
        echo "=== Testing boot ==="
        timeout 3s qemu-system-i386 \
          -drive file=boot.img,format=raw,if=floppy \
          -serial stdio \
          -display none \
          -monitor none \
          > boot_output.log 2>&1 || true
        
        echo "=== Boot Output ==="
        cat boot_output.log

    - name: Check for Success
      run: |
        if grep -q "BOOTED" boot_output.log; then
          echo "🎉 SUCCESS: Bootloader executed!"
        else
          echo "❌ FAILED: No boot output detected"
          echo "Debug info:"
          xxd -l 512 boot.img | tail -2
        fi
