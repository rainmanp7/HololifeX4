name: Bootloader Debug Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm qemu-system-i386 xxd

    - name: Verify Bootloader Signature
      run: |
        echo "=== Checking Bootloader ==="
        # First, let's check if boot.asm compiles correctly
        nasm -f bin boot.asm -o boot.bin
        echo "Bootloader size: $(stat -c%s boot.bin) bytes"
        
        # Check the boot signature at bytes 510-511
        echo "Boot signature (should be 55 AA):"
        xxd -s 510 -l 2 boot.bin
        
        # Check if the file ends properly
        echo "Last 16 bytes of bootloader:"
        xxd -s 496 -l 16 boot.bin

    - name: Build Minimal Test Kernel
      run: |
        echo "=== Building Test Kernel ==="
        nasm -f elf32 test_entry.asm -o test_kernel.o
        ld -m elf_i386 -Ttext 0x10000 -nostdlib -static test_kernel.o -o test_kernel.elf
        objcopy -O binary test_kernel.elf test_kernel.bin
        echo "Kernel size: $(stat -c%s test_kernel.bin) bytes"

    - name: Create Proper Bootable Image
      run: |
        echo "=== Creating Bootable Image ==="
        # Create image with explicit boot sector
        dd if=/dev/zero of=test.img bs=512 count=2880 status=none
        
        # Write bootloader to first sector
        dd if=boot.bin of=test.img conv=notrunc status=none
        
        # Write kernel starting at sector 2
        dd if=test_kernel.bin of=test.img bs=512 seek=1 conv=notrunc status=none
        
        echo "Final image structure:"
        echo "Sector 0: Bootloader"
        echo "Sector 1+: Kernel ($(stat -c%s test_kernel.bin) bytes)"
        xxd -l 1024 test.img | head -20

    - name: Test Boot with Explicit Format
      run: |
        echo "=== Testing Boot with Explicit Format ==="
        timeout 10s qemu-system-i386 \
          -drive file=test.img,format=raw,if=floppy \
          -serial stdio \
          -monitor stdio \
          -d cpu_reset,guest_errors \
          -no-reboot \
          -display none > boot_test.log 2>&1 || true
        
        echo "=== Boot Test Output ==="
        cat boot_test.log

    - name: Alternative Boot Test
      run: |
        echo "=== Alternative Boot Test ==="
        timeout 5s qemu-system-i386 \
          -fda test.img \
          -serial mon:stdio \
          -d int,cpu_reset \
          -no-reboot \
          -display none > alt_test.log 2>&1 || true
        
        echo "=== Alternative Test Output ==="
        cat alt_test.log

    - name: Upload Debug Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: boot-debug
        path: |
          *.bin
          *.img
          *.log
