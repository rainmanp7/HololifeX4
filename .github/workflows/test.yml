name: Minimal Bootloader Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies (QEMU and NASM)
      run: |
        sudo apt-get update
        # Install qemu for testing and nasm for assembly
        sudo apt-get install -y qemu-system-i386 nasm 
        
    - name: Assemble Bootloader
      # We now assemble the external file, avoiding the YAML parser conflict entirely.
      run: |
        echo "=== Assembling minimal bootloader ==="
        nasm -f bin minimal.asm -o boot.bin
        echo "Bootloader created: $(stat -c%s boot.bin) bytes"

    - name: Create Bootable Image
      run: |
        # Create a floppy image file
        dd if=/dev/zero of=boot.img bs=512 count=2880
        # Write the bootloader to the first sector of the image
        dd if=boot.bin of=boot.img conv=notrunc status=none
        echo "Image created"

    - name: Test Boot
      run: |
        echo "=== Testing boot ==="
        # Run QEMU with the floppy image and redirect serial output to a log file
        timeout 3s qemu-system-i386 \
          -drive file=boot.img,format=raw,if=floppy \
          -serial file:boot_output.log \
          -nographic \
          || true
        
        echo "=== Boot Output ==="
        cat boot_output.log

    - name: Check for Success
      run: |
        if grep -q "BOOTED" boot_output.log; then
          echo "🎉 SUCCESS: Bootloader executed!"
        else
          echo "❌ FAILED: No boot output detected"
          echo "Debug info: Last 2 lines of the image's first 512 bytes"
          xxd -l 512 boot.img | tail -2
          exit 1 # Fail the step if BOOTED is not found
        fi
