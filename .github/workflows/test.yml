name: Bootloader Debug - Fix SMM Issue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm qemu-system-i386 xxd

    - name: Debug Bootloader Compilation
      run: |
        echo "=== COMPILING BOOTLOADER ==="
        nasm -f bin boot.asm -o boot.bin
        echo "Bootloader size: $(stat -c%s boot.bin) bytes"
        
        echo "=== BOOT SIGNATURE CHECK ==="
        # Check bytes 510-511 - MUST BE 55 AA
        xxd -s 510 -l 2 boot.bin
        echo "Expected: 55aa"
        
        echo "=== BOOTLOADER HEX DUMP ==="
        xxd -l 512 boot.bin

    - name: Create Simple Test Image
      run: |
        echo "=== CREATING TEST IMAGE ==="
        # Create minimal image with JUST bootloader
        dd if=/dev/zero of=simple_test.img bs=512 count=1 status=none
        dd if=boot.bin of=simple_test.img conv=notrunc status=none
        
        echo "=== IMAGE VERIFICATION ==="
        xxd -l 512 simple_test.img

    - name: Test Boot with SMM Disabled
      run: |
        echo "=== TESTING WITH SMM DISABLED ==="
        timeout 5s qemu-system-i386 \
          -drive file=simple_test.img,format=raw,if=floppy \
          -serial stdio \
          -no-reboot \
          -display none \
          -d cpu_reset \
          -S \
          -s \
          > smm_test.log 2>&1 || true
        
        echo "=== BOOT TEST OUTPUT ==="
        cat smm_test.log

    - name: Test with Different QEMU Options
      run: |
        echo "=== TESTING ALTERNATIVE QEMU CONFIG ==="
        timeout 5s qemu-system-i386 \
          -fda simple_test.img \
          -serial mon:stdio \
          -no-shutdown \
          -no-reboot \
          -display none \
          -d guest_errors,cpu_reset \
          > alt_test.log 2>&1 || true
        
        echo "=== ALTERNATIVE TEST OUTPUT ==="
        cat alt_test.log

    - name: Verify Boot Signature Manually
      run: |
        echo "=== MANUAL BOOT SIGNATURE VERIFICATION ==="
        python3 -c "
        import sys
        with open('boot.bin', 'rb') as f:
            data = f.read()
            if len(data) >= 512:
                sig = data[510:512]
                print(f'Boot signature: {sig.hex()}')
                if sig == b'\\x55\\xaa':
                    print('✅ CORRECT BOOT SIGNATURE (55 AA)')
                else:
                    print('❌ WRONG BOOT SIGNATURE - SHOULD BE 55 AA')
                    sys.exit(1)
            else:
                print('❌ Bootloader too small')
                sys.exit(1)
        "

    - name: Upload Debug Files
      uses: actions/upload-artifact@v4
      with:
        name: boot-debug-files
        path: |
          *.bin
          *.img
          *.log
