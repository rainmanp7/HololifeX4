name: Basic Bootloader Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm qemu-system-i386 xxd

    - name: Build Test Kernel
      run: |
        echo "=== Building Test Kernel ==="
        nasm -f elf32 test_entry.asm -o test_kernel.o
        ld -m elf_i386 -Ttext 0x10000 -nostdlib -static test_kernel.o -o test_kernel.elf
        objcopy -O binary test_kernel.elf test_kernel.bin
        echo "Kernel size: $(stat -c%s test_kernel.bin) bytes"
        echo "First 64 bytes of kernel:"
        xxd -l 64 test_kernel.bin

    - name: Build Bootloader
      run: |
        echo "=== Building Bootloader ==="
        KERNEL_SIZE=$(stat -c%s test_kernel.bin)
        SECTORS=$(( (KERNEL_SIZE + 511) / 512 ))
        echo "Kernel: $KERNEL_SIZE bytes, Sectors: $SECTORS"
        nasm -f bin -DHOLOGRAPHIC_KERNEL_SECTORS=$SECTORS boot.asm -o boot.bin
        echo "Bootloader size: $(stat -c%s boot.bin) bytes"
        echo "Boot signature:"
        xxd -s 510 -l 2 boot.bin

    - name: Create Image
      run: |
        echo "=== Creating Disk Image ==="
        dd if=/dev/zero of=test.img bs=512 count=2880 status=none
        dd if=boot.bin of=test.img conv=notrunc status=none
        dd if=test_kernel.bin of=test.img bs=512 seek=1 conv=notrunc status=none
        echo "Image size: $(stat -c%s test.img) bytes"
        echo "First sector (bootloader):"
        xxd -l 512 test.img
        echo "Second sector (kernel start):"
        xxd -s 512 -l 64 test.img

    - name: Test Boot with Serial Logging
      run: |
        echo "=== Testing Boot Process ==="
        rm -f serial.log
        timeout 10s qemu-system-i386 \
          -fda test.img \
          -serial file:serial.log \
          -monitor stdio \
          -d cpu_reset,guest_errors \
          -no-reboot \
          -display none 2>qemu_error.log || true
        
        echo "=== Serial Output ==="
        if [ -f serial.log ]; then
          cat serial.log
        else
          echo "No serial output captured"
        fi
        
        echo "=== QEMU Errors ==="
        cat qemu_error.log

    - name: Test Boot with VGA (Alternative)
      run: |
        echo "=== Testing with VGA ==="
        timeout 5s qemu-system-i386 \
          -fda test.img \
          -serial stdio \
          -vga std \
          -display none > vga_output.log 2>&1 || true
        echo "VGA output:"
        cat vga_output.log

    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: boot-test-results
        path: |
          test.img
          boot.bin
          test_kernel.bin
          *.log
