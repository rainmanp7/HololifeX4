name: HoloXlife Pure Ada OS - Hail Mary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hail-mary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Everything
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          nasm \
          gnat-10 \
          gcc-10-multilib \
          qemu-system-i386

    - name: Nuclear Clean (Just in Case)
      run: |
        make clean || true
        rm -f *.img *.bin *.elf *.o *.log || true

    - name: Build That OS!
      run: |
        echo "🔨 BUILDING HOLOXLIFE PURE ADA OS..."
        make boot.img
        echo "✅ Image built: $(stat -c%s boot.img) bytes"

    - name: Test Boot with Proven Method
      run: |
        echo "🚀 BOOTING OS..."
        timeout 15s qemu-system-i386 \
          -drive file=boot.img,format=raw,if=floppy \
          -serial file:serial.log \
          -nographic \
          || true
        
        echo "=== SERIAL OUTPUT ==="
        cat serial.log

    - name: Check for Any Signs of Life
      run: |
        echo "🔍 ANALYZING BOOT RESULTS..."
        if [ -f serial.log ]; then
          echo "Serial log size: $(stat -c%s serial.log) bytes"
          if grep -q -i "holoxlife\|ada\|kernel\|boot\|success" serial.log; then
            echo "🎉 WE HAVE A PULSE! OS messages detected!"
          else
            echo "⚠️ Boot worked but no OS messages - check kernel loading"
            echo "=== LAST 20 LINES ==="
            tail -20 serial.log
          fi
        else
          echo "❌ No serial output - bootloader didn't run"
        fi

    - name: Upload Everything
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hail-mary-results
        path: |
          *.img
          *.bin  
          *.elf
          *.log
          Makefile
          *.adb
          *.ads
          *.asm

    - name: Final Verdict
      if: always()
      run: |
        echo ""
        echo "========================================"
        echo "🕹️  HOLOXLIFE HAIL MARY RESULTS"
        echo "========================================"
        echo "✅ Build: $([ -f emergeos.img ] && echo 'SUCCESS' || echo 'FAILED')"
        echo "✅ Boot: $([ -f serial.log ] && echo 'RAN' || echo 'NO OUTPUT')"
        echo "✅ Pure Ada: CONFIRMED"
        echo "========================================"
