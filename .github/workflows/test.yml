name: Basic Bootloader Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm qemu-system-i386

    - name: Build Test Kernel
      run: |
        # Build test kernel (assembly only)
        nasm -f elf32 test_entry.asm -o test_kernel.o
        ld -m elf_i386 -Ttext 0x10000 -nostdlib -static test_kernel.o -o test_kernel.elf
        objcopy -O binary test_kernel.elf test_kernel.bin

    - name: Build Bootloader
      run: |
        # Calculate sectors needed
        KERNEL_SIZE=$$(stat -c%s test_kernel.bin)
        SECTORS=$$(( (KERNEL_SIZE + 511) / 512 ))
        nasm -f bin -DHOLOGRAPHIC_KERNEL_SECTORS=$$SECTORS boot.asm -o boot.bin

    - name: Create Image
      run: |
        dd if=/dev/zero of=test.img bs=512 count=2880 status=none
        dd if=boot.bin of=test.img conv=notrunc status=none
        dd if=test_kernel.bin of=test.img bs=512 seek=1 conv=notrunc status=none

    - name: Test Boot
      run: |
        echo "Testing boot process (should see VGA output)..."
        timeout 5s qemu-system-i386 \
          -fda test.img \
          -serial stdio \
          -vga std \
          -display curses 2>&1 | head -20 || true

    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: boot-test
        path: |
          test.img
          boot.bin
          test_kernel.bin
