name: HoloXlife Pure Ada OS Build and Boot Test (QEMU)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test-pure-ada:
    runs-on: ubuntu-24.04  # ✅ Best for QEMU + newer toolchain
    timeout-minutes: 30
    env:
      IMAGE_NAME: emergeos.img
      SERIAL_LOG: serial.log
      QEMU_LOG: qemu.log
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧹 NUCLEAR CLEAN - Remove ALL Build Artifacts
        run: |
          echo "💥 NUCLEAR CLEAN - Ensuring pristine source state..."
          rm -rf *.o *.ali *.elf *.bin *.img *.adc *.log
          rm -rf .obj .libs build dist out target
          git clean -fdx -e '*.adb' -e '*.ads' -e '*.asm' -e '*.ld' -e 'Makefile' -e '*.txt' || true
          git reset --hard HEAD || true
          echo "✅ Nuclear clean complete"

      - name: Cache APT Packages
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-qemu-ada-${{ hashFiles('**/Makefile') }}-v1

      - name: Install Pure Ada Toolchain + QEMU
        run: |
          echo "📦 Installing GNAT + QEMU for Pure Ada OS..."
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential \
            nasm \
            gnat-12 \          # Ubuntu 24.04 defaults to gnat-12
            gcc-multilib \
            binutils \
            qemu-system-i386 \
            xxd \
            gettext-base
          echo "✅ Toolchain installed"

      - name: Verify Source Integrity
        run: |
          echo "🔍 Verifying source files..."
          REQUIRED_FILES=(
            "boot.asm" "linker.ld" "emergeos.ads" "emergeos.adb"
            "system.ads" "boot.adb" "Makefile"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              exit 1
            fi
          done
          echo "✅ All source files present"

      - name: Force Fresh Build Setup
        run: |
          rm -f *.o *.ali *.elf *.bin *.img gnat.adc 2>/dev/null || true
          cat > gnat.adc << 'EOF'
pragma Restrictions (No_Exceptions);
pragma Restrictions (No_Implicit_Heap_Allocations);
pragma Restrictions (No_Tasking);
pragma Restrictions (No_Protected_Types);
pragma Restrictions (No_Finalization);
pragma Restrictions (No_Secondary_Stack);
EOF
          echo "✅ gnat.adc created"

      - name: Build HoloXlife Pure Ada OS
        run: |
          echo "🔨 Building HoloXlife Pure Ada OS..."
          make boot.o || { echo "❌ Bootloader failed"; exit 1; }
          make emergeos.o || { echo "❌ Kernel failed"; exit 1; }
          make kernel.bin || { echo "❌ Linking failed"; exit 1; }
          make boot.bin || { echo "❌ Boot binary failed"; exit 1; }
          make $IMAGE_NAME || { echo "❌ Image creation failed"; exit 1; }
          echo "🎉 BUILD SUCCESSFUL!"
          ls -la *.bin *.img

      - name: Analyze OS Image
        run: |
          echo "📊 Analyzing OS image..."
          if [ -f "$IMAGE_NAME" ]; then
            size=$(stat -c%s "$IMAGE_NAME")
            echo "Image size: ${size} bytes"
            if [ "$size" -eq 1474560 ]; then
              echo "✅ Standard 1.44MB floppy size"
            else
              echo "⚠️ Non-standard size"
            fi
          else
            echo "❌ Image missing"
            exit 1
          fi

          if [ -f boot.bin ]; then
            sig=$(xxd -s -2 -l 2 boot.bin | cut -d' ' -f2)
            if [ "$sig" = "55aa" ]; then
              echo "✅ Valid boot signature (0x55AA)"
            else
              echo "❌ Invalid boot signature: $sig"
            fi
          fi

      - name: Test Pure Ada OS Boot with QEMU
        run: |
          echo "🚀 Booting HoloXlife OS in QEMU (headless)..."
          if [ ! -f "$IMAGE_NAME" ]; then
            echo "❌ OS image not found"
            exit 1
          fi

          # Clean logs
          rm -f "$SERIAL_LOG" "$QEMU_LOG"

          # Run QEMU for up to 15 seconds
          # -nographic: disable GUI, redirect serial to stdio
          # -serial file:... captures COM1 output
          # -no-reboot: exit on triple fault or shutdown
          set +e
          timeout 15s qemu-system-i386 \
            -fda "$IMAGE_NAME" \
            -serial "file:$SERIAL_LOG" \
            -nographic \
            -no-reboot \
            > "$QEMU_LOG" 2>&1
