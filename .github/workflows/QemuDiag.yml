name: HoloXlife Pure Ada OS (QEMU)

on: [push, pull_request, workflow_dispatch]

jobs:
  build-and-test-pure-ada:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clean workspace
        run: |
          echo "🧹 Cleaning..."
          rm -rf *.o *.ali *.elf *.bin *.img *.adc *.log .obj build
          git clean -fdx

      - name: Install tools
        run: |
          echo "📦 Installing..."
          sudo apt-get update
          sudo apt-get install -y gnat-12 nasm qemu-system-i386 xxd

      - name: Check required files
        run: |
          echo "🔍 Checking files..."
          for f in boot.asm linker.ld emergeos.ads emergeos.adb system.ads boot.adb Makefile; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f"
              exit 1
            fi
          done
          echo "✅ All files present"

      - name: Create gnat.adc
        run: |
          echo "📝 Creating gnat.adc..."
          echo "pragma Restrictions (No_Exceptions);" > gnat.adc
          echo "pragma Restrictions (No_Implicit_Heap_Allocations);" >> gnat.adc
          echo "pragma Restrictions (No_Tasking);" >> gnat.adc
          echo "pragma Restrictions (No_Protected_Types);" >> gnat.adc
          echo "pragma Restrictions (No_Finalization);" >> gnat.adc
          echo "pragma Restrictions (No_Secondary_Stack);" >> gnat.adc
          cat gnat.adc # Optional: Verify content

      - name: Build OS
        run: |
          echo "🔨 Building..."
          make emergeos.img || { echo "❌ Build failed"; exit 1; }
          ls -l emergeos.img

      - name: Test in QEMU
        run: |
          echo "🚀 Testing in QEMU..."
          timeout 10s qemu-system-i386 -fda emergeos.img -serial file:serial.log -nographic -no-reboot || true
          echo "📄 Serial output:"
          cat serial.log || echo "No output"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holoxlife-artifacts
          path: |
            emergeos.img
            serial.log
            gnat.adc
