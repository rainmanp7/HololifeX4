name: Test HoloXlife Boot

on: [push, pull_request]

jobs:
  boot-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Bochs
        run: sudo apt-get update && sudo apt-get install -y bochs

      - name: Create clean bochsrc.txt
        run: |
          rm -f bochsrc.txt
          echo "boot: floppy" >> bochsrc.txt
          echo "floppya: 1_44=emergeos.img, status=inserted" >> bochsrc.txt
          echo "romimage: file=/usr/share/bochs/BIOS-bochs-latest" >> bochsrc.txt
          echo "vgaromimage: file=/usr/share/bochs/VGABIOS-lgpl-latest" >> bochsrc.txt
          echo "display_library: term" >> bochsrc.txt
          echo "cpu: count=1, ips=4000000" >> bochsrc.txt
          echo "megs: 32" >> bochsrc.txt
          echo "log: bochs.log" >> bochsrc.txt
          echo "panic: action=report" >> bochsrc.txt
          echo "error: action=report" >> bochsrc.txt
          echo "com1: enabled=1, mode=file, dev=serial.log" >> bochsrc.txt
          echo "mouse: enabled=0" >> bochsrc.txt
          echo "keyboard: type=mf" >> bochsrc.txt
          echo "clock: sync=realtime" >> bochsrc.txt
          echo "magic_break: enabled=1" >> bochsrc.txt

      - name: Run Bochs
        run: timeout 15s bochs -q -f bochsrc.txt || true

      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            bochs.log
            serial.log
