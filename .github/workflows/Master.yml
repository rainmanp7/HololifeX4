# GitHub Actions Workflow for HoloXlife OS (v5 Protocol Harmonized, Transmission-Proof Cleanse)
name: HoloXlife OS Build and Verify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository's code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install build dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-10 gnat-10 qemu-system-i36 make

      # Step 3: Force Clean Workspace (Protocol Fortified)
      # This is the new, transmission-proof exorcism ritual.
      # We use a series of simple 'rm' commands with glob patterns.
      # 'shopt -s globstar' enables recursive matching with '**'.
      # '|| true' ensures the step succeeds even if no files match.
      - name: 🗑️ Force Clean Workspace to Exorcise Ghosts
        run: |
          shopt -s globstar
          rm -f **/*.o || true
          rm -f **/*.ali || true
          rm -f **/*.bin || true
          rm -f **/*.elf || true
          rm -f **/*.img || true
          rm -f gnat.adc || true
          rm -f **/*.log || true
          echo "Workspace purged of all known temporal artifacts."

      # Step 4: Build the OS image
      - name: Build emergeos.img
        run: make all

      # Step 5: Run a quick "smoke test" to verify boot
      - name: Run Smoke Test in QEMU
        run: |
          timeout 15s make run || true
          echo "Smoke test complete. Checking for log files..."

      # Step 6: Upload comprehensive build artifacts for review
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HoloXlife-OS-Build-Package
          path: |
            emergeos.img
            *.log
            *.ads
            *.adb
            boot.asm
            Makefile
            linker.ld
            gnat.adc
