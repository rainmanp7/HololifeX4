# GitHub Actions Workflow for HoloXlife OS (v5 Protocol Harmonized, Fortified Cleanse)
name: HoloXlife OS Build and Verify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository's code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install build dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-10 gnat-10 qemu-system-i386 make

      # Step 3: Force Clean Workspace (Protocol Fortified)
      # This is the new, explicit exorcism ritual.
      # We use 'find' to locate and destroy all known build artifacts (.o, .ali, .bin, etc.)
      # This is more robust than 'make clean' and guarantees a state of absolute purity.
      - name: 🗑️ Force Clean Workspace to Exorcise Ghosts
        run: |
          # The find command searches the entire directory tree (.)
          # -type f specifies we only want files, not directories.
          # We provide a list of patterns to match (-name "*.o" -o -name "*.ali" ...)
          # -delete tells find to delete what it finds.
          # This command will not fail if no files are found.
          find . -type f KATEX_INLINE_OPEN \
            -name "*.o" -o \
            -name "*.ali" -o \
            -name "*.bin" -o \
            -name "*.elf" -o \
            -name "*.img" -o \
            -name "gnat.adc" -o \
            -name "*.log" \
          KATEX_INLINE_CLOSE -delete
          echo "Workspace purged of all known temporal artifacts."

      # Step 4: Build the OS image
      - name: Build emergeos.img
        run: make all

      # Step 5: Run a quick "smoke test" to verify boot
      - name: Run Smoke Test in QEMU
        run: |
          timeout 15s make run || true
          echo "Smoke test complete. Checking for log files..."

      # Step 6: Upload comprehensive build artifacts for review
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HoloXlife-OS-Build-Package
          path: |
            emergeos.img
            *.log
            *.ads
            *.adb
            boot.asm
            Makefile
            linker.ld
            gnat.adc
