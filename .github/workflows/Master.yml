# GitHub Actions Workflow for HoloXlife OS (v5 Protocol Harmonized)
name: HoloXlife OS Build and Verify

# This workflow runs on every push or pull request to the 'main' branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # The 'build' job runs on a fresh Ubuntu virtual machine
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository's code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install build dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-10 gnat-10 qemu-system-i386 make

      # Step 3: Clean Workspace (Protocol Mandated)
      # This is the crucial step to prevent "ghosts in the machine".
      # It destroys any old artifacts (.o, .ali, etc.) before the build begins,
      # ensuring a state of known purity.
      - name: Clean Workspace to Exorcise Ghosts
        run: make clean

      # Step 4: Build the OS image
      # Now that the environment is clean, we can proceed with the build.
      - name: Build emergeos.img
        run: make all

      # Step 5: Run a quick "smoke test" to verify boot
      - name: Run Smoke Test in QEMU
        run: |
          timeout 15s make run || true
          echo "Smoke test complete. Checking for log files..."

      # Step 6: Upload comprehensive build artifacts for review
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HoloXlife-OS-Build-Package
          path: |
            # The final, bootable OS image
            emergeos.img
            
            # All log files generated by the build and test run
            *.log
            
            # All Ada source and specification files
            *.ads
            *.adb
            
            # The bootloader source code
            boot.asm
            
            # The build and linker scripts
            Makefile
            linker.ld
            
            # The generated Ada configuration file
            gnat.adc
